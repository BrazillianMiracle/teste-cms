<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Simples</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Login EloCriativo</h2>
        
        <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-4 border rounded">
        <input type="password" id="senha" placeholder="Senha" class="w-full p-2 mb-4 border rounded">
        
        <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Entrar
        </button>

        <p id="mensagem" class="mt-4 text-center text-sm"></p>
    </div>

    <script>
        // 1. CONFIGURAÇÃO
        const SUPABASE_URL = "https://cbmyddxxmwhsbemcnrvb.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibXlkZHh4bXdoc2JlbWNucnZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjA2MjIsImV4cCI6MjA5ODgzNjYyMn0.CdutNfXlo4cF7C2edIKpYYe1_KvAP3AbHbFfvumBp0M";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. FUNÇÃO DE LOGIN
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');

            msg.innerText = "Aguarde...";

            try {
                const { data, error } = await supabase
                    .from('lojas')
                    .select('*')
                    .eq('email_institucional', email)
                    .eq('senha_seguranca', senha)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    msg.className = "mt-4 text-center text-green-600";
                    msg.innerText = "Sucesso! Logado como: " + data.nome_fantasia;
                    console.log("Dados do usuário:", data);
                } else {
                    msg.className = "mt-4 text-center text-red-600";
                    msg.innerText = "Email ou senha incorretos.";
                }
            } catch (err) {
                msg.className = "mt-4 text-center text-red-600";
                msg.innerText = "Erro: " + err.message;
                console.error(err);
            }
        }
    </script>
</body>
</html>
