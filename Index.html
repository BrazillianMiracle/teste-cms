<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Loja Social</title>
    <!-- Tailwind CSS via CDN para estilo rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

    <h1 class="text-3xl font-bold mb-6">TECH_STORE_OS</h1>

    <!-- Vitrine de Produtos -->
    <div id="vitrine" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Item de Exemplo -->
        <div class="border p-4 rounded-lg">
            <h2 class="text-xl font-semibold">Processador Intel i9</h2>
            <p class="text-gray-400">Alta performance.</p>
            <a href="https://wa.me/55062993901617?text=Quero comprar o Processador Intel i9" 
               class="mt-4 block bg-green-600 text-center py-2 rounded">Comprar via WhatsApp</a>
        </div>
    </div>

    <script>
        // Lógica simples: Lista de produtos para simular o banco de dados
        const produtos = [
            { nome: "Processador Intel i9", desc: "14th Gen" },
            { nome: "Placa de Vídeo RTX 4090", desc: "Poderosa" }
        ];

        const vitrine = document.getElementById('vitrine');
        
        // Renderiza os produtos sem precisar de backend complexo
        produtos.forEach(p => {
            vitrine.innerHTML += `
                <div class="border p-4 rounded-lg">
                    <h2 class="text-xl font-semibold">${p.nome}</h2>
                    <p class="text-gray-400">${p.desc}</p>
                    <a href="https://wa.me/55062993901617?text=Quero comprar ${p.nome}" 
                       class="mt-4 block bg-green-600 text-center py-2 rounded">Comprar via WhatsApp</a>
                </div>
            `;
        });
    </script>
</body>
</html>
