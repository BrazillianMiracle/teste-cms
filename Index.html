<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH_STORE_OS | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-black text-white font-sans selection:bg-cyan-500">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center glass">
        <h1 class="text-xl font-bold tracking-tighter">TECH_STORE_OS</h1>
        <div id="user-info" class="text-sm text-gray-400">Não autenticado</div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-10">
        <!-- Auth Section -->
        <div id="auth-box" class="glass p-8 rounded-2xl mb-10 text-center">
            <h2 class="text-2xl font-bold mb-4">Acesse seu Terminal</h2>
            <input id="email" type="email" placeholder="email@exemplo.com" class="bg-black border border-gray-700 p-3 rounded w-full mb-3">
            <button onclick="signIn()" class="bg-cyan-600 hover:bg-cyan-500 w-full py-3 rounded-lg font-bold transition">Entrar via Magic Link</button>
        </div>

        <!-- Loja Grid -->
        <div id="loja" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Cards gerados via JS -->
        </div>
    </main>

    <script>
        // Configuração: Substitua pelas suas chaves do Supabase
        const supabase = supabase.createClient('SUA_URL_SUPABASE', 'SUA_KEY_ANON');

        const produtos = [
            { nome: "RTX 4090", desc: "GPU de última geração", preco: "R$ 12.000" },
            { nome: "Intel i9 14th", desc: "Processador ultra rápido", preco: "R$ 4.500" }
        ];

        function renderLoja() {
            const container = document.getElementById('loja');
            container.innerHTML = produtos.map(p => `
                <div class="glass p-6 rounded-2xl hover:border-cyan-500 transition-all duration-300">
                    <h3 class="text-lg font-bold">${p.nome}</h3>
                    <p class="text-gray-400 text-sm mb-4">${p.desc}</p>
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-cyan-400">${p.preco}</span>
                        <a href="https://wa.me/55062993901617?text=Quero comprar ${p.nome}" 
                           class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold hover:bg-cyan-400 transition">COMPRAR</a>
                    </div>
                </div>
            `).join('');
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const { error } = await supabase.auth.signInWithOtp({ email });
            alert(error ? "Erro ao enviar email" : "Verifique seu email para logar!");
        }

        renderLoja();
    </script>
</body>
</html>
