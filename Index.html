<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EloCriativo | Auth & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-4">

    <div id="auth-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
        <h2 class="text-xl font-bold mb-4">Login EloCriativo</h2>
        <button id="btn-google" class="w-full bg-red-500 text-white p-3 rounded-lg font-bold hover:bg-red-600">
            Entrar com Google
        </button>
    </div>

    <div id="dashboard-section" class="hidden max-w-4xl mx-auto mt-10">
        <h2 class="text-2xl font-bold mb-4">Ateliês Cadastrados</h2>
        <div id="users-list" class="grid gap-3"></div>
        <button onclick="logout()" class="mt-4 bg-gray-500 text-white p-2 rounded">Sair</button>
    </div>

    <script>
        const SUPABASE_URL = "https://cbmyddxxmwhsbemcnrvb.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibXlkZHh4bXdoc2JlbWNucnZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjA2MjIsImV4cCI6MjA5ODgzNjYyMn0.CdutNfXlo4cF7C2edIKpYYe1_KvAP3AbHbFfvumBp0M";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Google Auth
        document.getElementById('btn-google').addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) alert("Erro Google: " + error.message);
        });

        // 2. Verificar Estado de Login
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadUsers();
            }
        }

        // 3. Listar Usuários da Tabela
        async function loadUsers() {
            const listDiv = document.getElementById('users-list');
            const { data, error } = await supabase.from('lojas').select('*');
            
            if (error) {
                listDiv.innerHTML = `<p class="text-red-500">Erro: ${error.message}</p>`;
                return;
            }
            listDiv.innerHTML = data.map(u => `
                <div class="p-4 bg-white border rounded shadow-sm">
                    ${u.nome_fantasia} - ${u.email_institucional}
                </div>
            `).join('');
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        checkSession();
    </script>
</body>
</html>
